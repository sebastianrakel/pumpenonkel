esphome:
  name: pumpenonkel_pico

rp2040:
  board: rpipicow
  framework:
    platform_version: https://github.com/maxgerhardt/platform-raspberrypi.git

# Enable logging
logger:

web_server:
  port: 80
# Enable Home Assistant API
api:

ota:
  - platform: esphome
    password: ""

captive_portal:

wifi:
  ssid: !secret wifi_name
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pumpenonkel Fallback Hotspot"
    password: "XTWMRkP72S7d"
    
switch:
  - platform: gpio
    pin: GPIO11
    name: "Kanal 6"
    id: kanal_6
  - platform: gpio
    pin: GPIO10
    name: "Kanal 5"
    id: kanal_5
  - platform: gpio
    pin: GPIO9
    name: "Kanal 4"
    id: kanal_4
  - platform: gpio
    pin: GPIO8
    name: "Kanal 3"
    id: kanal_3
  - platform: gpio
    pin: GPIO7
    name: "Kanal 2"
    id: kanal_2
  - platform: gpio
    pin: GPIO6
    name: "Kanal 1"
    id: kanal_1
  
