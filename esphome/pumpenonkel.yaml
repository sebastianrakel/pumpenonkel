esphome:
  name: pumpenonkel

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "Rakel-WLAN"
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pumpenonkel Fallback Hotspot"
    password: "XTWMRkP72S7d"

captive_portal:

web_server:
  port: 80
    
switch:
  - platform: gpio
    pin: GPIO23
    name: "Kanal 8"
    inverted: true
  - platform: gpio
    pin: GPIO22
    name: "Kanal 7"
    inverted: true
  - platform: gpio
    pin: GPIO32
    name: "Kanal 6"
    inverted: true
  - platform: gpio
    pin: GPIO33
    name: "Kanal 5"
    inverted: true
  - platform: gpio
    pin: GPIO25
    name: "Kanal 4"
    inverted: true
  - platform: gpio
    pin: GPIO26
    name: "Kanal 3"
    inverted: true
  - platform: gpio
    pin: GPIO27
    name: "Kanal 2"
    inverted: true
  - platform: gpio
    pin: GPIO14
    name: "Kanal 1"
    inverted: true
  
